version: '3.8'

services:
  api-service:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # --- Variables para la conexión a la BD dentro de Docker ---
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/colabora
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      # Actualizado para que la API se comunique con MinIO dentro de la red de Docker
      # --- Variables para la conexión a MinIO dentro de Docker ---
      MINIO_ENDPOINT: http://minio:9000 
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      # --- Variables de tu aplicación tomadas del .env ---
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin123
      # Nota: Los puntos (.) en los nombres de variables se reemplazan por guiones bajos (_)
      SECURITY_JWT_USER_GENERATOR: AUTH0JWT-BACKEND
      SECURITY_JWT_KEY_PRIVATE: key
    depends_on:
      - db
      - minio # Añadida dependencia de MinIO
    entrypoint: ["sh","-c","until nc -z db 5432; do echo waiting for db; sleep 1; done; exec java -jar /app/app.jar"]

  db:
    image: postgres:16-alpine
    container_name: colabora-db
    environment:
      POSTGRES_DB: colabora
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Nuevo servicio para MinIO
  minio:
    image: quay.io/minio/minio
    container_name: colabora-minio
    ports:
      - "9000:9000" # Puerto de la API de MinIO
      - "9001:9001" # Puerto de la consola de MinIO
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

volumes:
  pgdata:
  miniodata: # Volumen para persistir los datos de MinIO
